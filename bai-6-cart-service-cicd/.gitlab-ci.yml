stages:
  - test
  - build
  - dockerize

variables:
  IMAGE_NAME: $DOCKER_USERNAME/cart-service

# Stage 1: Chạy Integration Test với PostgreSQL
test:
  stage: test
  image: gradle:7.6-jdk17
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    POSTGRES_DB: tiki_cart_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: test_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiki_cart_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: test_password
    SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew test

# Stage 2: Đóng gói file .jar (chỉ chạy khi Stage test PASSED)
build:
  stage: build
  image: gradle:7.6-jdk17
  needs:
    - job: test
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day

# Stage 3: Build Docker Image gắn tag $CI_COMMIT_SHORT_SHA và Push lên Registry
dockerize:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: build
      artifacts: true
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
